<!DOCTYPE html>
<html>
    <head>
        <title>
            Friend Library
        </title>
        <link rel="stylesheet" href="../static/Data.css">
    </head>
    <body>
        <h1 id="title">Table of Friends</h1>
        <table>
            <tr>
                <th>Name</th>
                <th>DOB</th>
                <th>Educational_bg</th>
                <th>How we met</th>
                <th>Likes</th>
                <th>Dislikes</th>
                <th>Hobbies</th>
                <th>Additional Info</th>
                <th>Relationship</th>
                <th>CAA</th>
            </tr>
            {% for friend in friends %}
            <tr>
                {% for detail in friend %}
                <td>{{ detail }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </table><br>
        <p><a href="{{ url_for('index') }}">Go back</a></p>
    </body>
</html>
